<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Vinyl Library">
    <meta name="theme-color" content="#1a1a1a">
    <title>Vinyl Rock Library</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Login Screen */
        .login-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-screen.active {
            display: flex;
        }

        .login-card {
            background: linear-gradient(135deg, #2a2a2a, #3a3a3a);
            border: 2px solid #d4af37;
            border-radius: 15px;
            padding: 50px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
        }

        .login-card h1 {
            color: #d4af37;
            margin-bottom: 10px;
            font-size: 2.5em;
            text-align: center;
        }

        .login-card p {
            color: #888;
            text-align: center;
            margin-bottom: 40px;
            font-size: 0.95em;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .login-form input {
            padding: 15px;
            border: 1px solid #d4af37;
            background: rgba(255, 255, 255, 0.08);
            color: #e0e0e0;
            border-radius: 5px;
            font-size: 1em;
        }

        .login-buttons {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        .btn-login {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-admin {
            background: linear-gradient(135deg, #d4af37, #ffd700);
            color: #1a1a1a;
        }

        .btn-guest {
            background: #555;
            color: #e0e0e0;
        }

        .login-error {
            color: #ff6b6b;
            text-align: center;
            display: none;
        }

        /* Header */
        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px 0;
            border-bottom: 3px solid #d4af37;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        h1 {
            font-size: 3em;
            color: #d4af37;
            margin-bottom: 10px;
            flex: 1;
        }

        .subtitle {
            color: #888;
            font-size: 1.1em;
            flex: 1;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(212, 175, 55, 0.1);
            padding: 12px 20px;
            border-radius: 8px;
            border: 1px solid #d4af37;
        }

        .user-role {
            color: #d4af37;
            font-weight: 600;
            font-size: 0.9em;
        }

        .user-name {
            color: #aaa;
            font-size: 0.85em;
        }

        .btn-logout {
            background: #8b4444;
            color: #e0e0e0;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        /* Control Panel */
        .control-panel {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #d4af37;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 30px;
        }

        .control-panel.hidden {
            display: none;
        }

        .control-panel h2 {
            color: #d4af37;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .form-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            color: #d4af37;
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }

        input[type="text"],
        input[type="file"],
        select,
        textarea {
            padding: 12px;
            border: 1px solid #d4af37;
            background: rgba(255, 255, 255, 0.08);
            color: #e0e0e0;
            border-radius: 5px;
            font-size: 1em;
            width: 100%;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-primary {
            background: linear-gradient(135deg, #d4af37, #ffd700);
            color: #1a1a1a;
        }

        .btn-secondary {
            background: #555;
            color: #e0e0e0;
        }

        .btn-danger {
            background: #8b4444;
            color: #e0e0e0;
        }

        .button-group {
            display: flex;
            gap: 10px;
            grid-column: 1 / -1;
        }

        .button-group button {
            flex: 1;
        }

        /* Stats */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid #d4af37;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
        }

        .stat-number {
            font-size: 2.5em;
            color: #ffd700;
            font-weight: bold;
        }

        .stat-label {
            color: #aaa;
            margin-top: 10px;
        }

        /* Gallery */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 25px;
            margin-top: 30px;
        }

        .vinyl-card {
            background: linear-gradient(135deg, #2a2a2a, #3a3a3a);
            border: 2px solid #d4af37;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .vinyl-card:hover {
            transform: translateY(-10px);
            border-color: #ffd700;
        }

        .album-cover {
            width: 100%;
            height: 250px;
            background: linear-gradient(135deg, #555, #333);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3em;
            overflow: hidden;
        }

        .album-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-info {
            padding: 20px;
        }

        .card-info h3 {
            color: #ffd700;
            margin-bottom: 8px;
        }

        .card-info p {
            color: #aaa;
            margin-bottom: 8px;
        }

        .genre-tag {
            display: inline-block;
            background: rgba(212, 175, 55, 0.2);
            border: 1px solid #d4af37;
            color: #d4af37;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            margin-bottom: 12px;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-y: auto;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, #2a2a2a, #3a3a3a);
            border: 2px solid #d4af37;
            border-radius: 10px;
            padding: 30px;
            max-width: 700px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            margin: auto;
        }

        .modal-content h2 {
            color: #d4af37;
            margin-bottom: 20px;
        }

        .close-modal {
            float: right;
            font-size: 2em;
            color: #d4af37;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
        }

        .track-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #555;
            border-radius: 5px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .track-number {
            color: #d4af37;
            font-weight: bold;
            min-width: 30px;
            text-align: center;
        }

        .track-info {
            flex: 1;
        }

        .track-name {
            color: #e0e0e0;
            font-weight: 500;
        }

        .track-duration {
            color: #888;
            font-size: 0.9em;
        }

        .track-delete-btn {
            background: #8b4444;
            border: none;
            color: #e0e0e0;
            padding: 6px 12px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.85em;
        }

        .track-delete-btn.hidden {
            display: none;
        }

        .add-track-form {
            background: rgba(212, 175, 55, 0.08);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .add-track-form.hidden {
            display: none;
        }

        .add-track-form input {
            margin-bottom: 10px;
        }

        .tracklist-section {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid #d4af37;
        }

        .tracklist-section h3 {
            color: #d4af37;
            margin-bottom: 15px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        @media (max-width: 768px) {
            h1 { font-size: 1.8em; }
            header { flex-direction: column; }
            .gallery { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
            .form-group { grid-template-columns: 1fr; }
            .login-card { padding: 25px; }
        }
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div id="loginScreen" class="login-screen active">
        <div class="login-card">
            <h1>🎸 VINYL LIBRARY</h1>
            <p>Добро пожаловать!</p>
            
            <form id="loginForm" class="login-form">
                <input type="text" id="loginUsername" placeholder="Имя пользователя" required>
                <input type="password" id="loginPassword" placeholder="Пароль" required>
                <div class="login-error" id="loginError"></div>
                
                <div class="login-buttons">
                    <button type="button" class="btn-login btn-admin" onclick="loginAsAdmin()">👤 Admin</button>
                    <button type="button" class="btn-login btn-guest" onclick="loginAsGuest()">👁️ Guest</button>
                </div>
            </form>
        </div>
    </div>

    <div class="container" id="mainContainer" style="display: none;">
        <!-- Header -->
        <header>
            <div>
                <h1>🎸 VINYL ROCK LIBRARY</h1>
                <p class="subtitle">Ваша коллекция виниловых пластинок</p>
            </div>
            <div class="user-info">
                <div>
                    <div class="user-role" id="userRole"></div>
                    <div class="user-name" id="userName"></div>
                </div>
                <button class="btn-logout" onclick="logout()">Выход</button>
            </div>
        </header>

        <!-- Stats -->
        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="totalCount">0</div>
                <div class="stat-label">Всего пластинок</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="genreCount">0</div>
                <div class="stat-label">Жанров</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="artistCount">0</div>
                <div class="stat-label">Исполнителей</div>
            </div>
        </div>

        <!-- Control Panel -->
        <div class="control-panel" id="controlPanel">
            <h2>➕ Добавить пластинку</h2>
            <form id="addVinylForm">
                <div class="form-group">
                    <div>
                        <label for="artist">Исполнитель *</label>
                        <input type="text" id="artist" placeholder="The Beatles, Pink Floyd..." required>
                    </div>
                    <div>
                        <label for="album">Название альбома *</label>
                        <input type="text" id="album" placeholder="Abbey Road, The Wall..." required>
                    </div>
                </div>

                <div class="form-group">
                    <div>
                        <label for="year">Год выпуска</label>
                        <input type="text" id="year" placeholder="1969">
                    </div>
                    <div>
                        <label for="genre">Жанр *</label>
                        <select id="genre" required>
                            <option value="">Выберите жанр</option>
                            <option value="Classic Rock">Classic Rock</option>
                            <option value="Progressive Rock">Progressive Rock</option>
                            <option value="Hard Rock">Hard Rock</option>
                            <option value="Punk Rock">Punk Rock</option>
                            <option value="Alternative Rock">Alternative Rock</option>
                            <option value="Psychedelic Rock">Psychedelic Rock</option>
                            <option value="Heavy Metal">Heavy Metal</option>
                            <option value="Grunge">Grunge</option>
                        </select>
                    </div>
                </div>

                <div class="form-group full">
                    <div>
                        <label for="description">Описание / Заметки</label>
                        <textarea id="description" placeholder="Добавьте интересные факты..."></textarea>
                    </div>
                </div>

                <div class="form-group full">
                    <div>
                        <label for="coverImage">Обложка альбома (изображение)</label>
                        <input type="file" id="coverImage" accept="image/*">
                        <small style="color: #888; margin-top: 5px;">JPG, PNG, WebP (макс. 5MB)</small>
                    </div>
                </div>

                <div class="button-group">
                    <button type="submit" class="btn-primary">🎵 Добавить</button>
                    <button type="reset" class="btn-secondary">Очистить</button>
                </div>
            </form>
        </div>

        <!-- Gallery -->
        <div id="gallery" class="gallery"></div>

        <!-- Empty State -->
        <div id="emptyState" class="empty-state" style="display: none;">
            <div style="font-size: 4em; margin-bottom: 20px;">💿</div>
            <p>Библиотека пока пуста</p>
        </div>
    </div>

    <!-- Modal -->
    <div id="detailModal" class="modal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeDetailModal()">&times;</button>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        // Firebase REST API Configuration
        const FIREBASE_DB_URL = 'https://vinyl-library-7f059-default-rtdb.europe-west1.firebasedatabase.app';
        const VINYL_PATH = '/vinylCollection.json';

        // Global state
        let vinylCollection = [];
        let currentUser = null;
        let isAdmin = false;

        // Load data from Firebase via REST API
        async function loadFromFirebase() {
            try {
                console.log('📡 Загружаем данные с Firebase...');
                const response = await fetch(FIREBASE_DB_URL + VINYL_PATH);
                const data = await response.json();
                
                if (data && typeof data === 'object') {
                    vinylCollection = Object.values(data);
                    console.log('✅ Загружено:', vinylCollection.length, 'альбомов');
                } else {
                    vinylCollection = [];
                    console.log('ℹ️ Firebase пуста');
                }
                
                saveToLocalStorage();
                updateStats();
                renderGallery();
            } catch (error) {
                console.error('❌ Ошибка загрузки Firebase:', error);
                loadFromLocalStorage();
            }
        }

        // Load from localStorage
        function loadFromLocalStorage() {
            try {
                const stored = localStorage.getItem('vinylCollection');
                if (stored) {
                    vinylCollection = JSON.parse(stored);
                    console.log('📂 Загружено из localStorage:', vinylCollection.length);
                    updateStats();
                    renderGallery();
                }
            } catch (e) {
                console.error('❌ LocalStorage ошибка:', e);
            }
        }

        // Save to Firebase via REST API
        async function saveToFirebase() {
            try {
                console.log('📤 Сохраняем в Firebase...');
                const dataToSave = {};
                vinylCollection.forEach(vinyl => {
                    dataToSave[vinyl.id] = vinyl;
                });

                const response = await fetch(FIREBASE_DB_URL + VINYL_PATH, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dataToSave)
                });

                if (response.ok) {
                    console.log('✅ Сохранено в Firebase');
                }
            } catch (error) {
                console.error('❌ Ошибка сохранения:', error);
            }
        }

        // Save to localStorage
        function saveToLocalStorage() {
            localStorage.setItem('vinylCollection', JSON.stringify(vinylCollection));
        }

        // Save everywhere
        function saveStorage() {
            saveToLocalStorage();
            saveToFirebase();
        }

        // Convert file to base64
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        // Login
        function loginAsAdmin() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value.trim();

            if (username === 'admin' && password === 'admin123') {
                currentUser = username;
                isAdmin = true;
                enterApp();
            } else {
                showLoginError('Неверные учетные данные');
            }
        }

        function loginAsGuest() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value.trim();

            if (username === 'guest' && password === 'guest123') {
                currentUser = username;
                isAdmin = false;
                enterApp();
            } else {
                showLoginError('Неверные учетные данные');
            }
        }

        function showLoginError(message) {
            const error = document.getElementById('loginError');
            error.textContent = message;
            error.style.display = 'block';
            setTimeout(() => error.style.display = 'none', 3000);
        }

        function enterApp() {
            document.getElementById('loginScreen').classList.remove('active');
            document.getElementById('mainContainer').style.display = 'block';
            
            document.getElementById('userRole').textContent = isAdmin ? '👤 Администратор' : '👁️ Гость';
            document.getElementById('userName').textContent = currentUser;

            if (isAdmin) {
                document.getElementById('controlPanel').classList.remove('hidden');
            } else {
                document.getElementById('controlPanel').classList.add('hidden');
            }

            console.log('🎸 Загружаем коллекцию для', currentUser);
            loadFromFirebase();
        }

        function logout() {
            if (confirm('Вы уверены?')) {
                currentUser = null;
                isAdmin = false;
                document.getElementById('loginScreen').classList.add('active');
                document.getElementById('mainContainer').style.display = 'none';
                document.getElementById('loginUsername').value = '';
                document.getElementById('loginPassword').value = '';
            }
        }

        // Add vinyl
        document.getElementById('addVinylForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            if (!isAdmin) {
                alert('Только администратор может добавлять');
                return;
            }

            const coverImageInput = document.getElementById('coverImage');
            let coverImage = null;

            if (coverImageInput.files.length > 0) {
                const file = coverImageInput.files[0];
                if (file.size > 5 * 1024 * 1024) {
                    alert('Размер файла не должен превышать 5MB');
                    return;
                }
                coverImage = await fileToBase64(file);
            }

            const newVinyl = {
                id: Date.now(),
                artist: document.getElementById('artist').value.trim(),
                album: document.getElementById('album').value.trim(),
                year: document.getElementById('year').value.trim(),
                genre: document.getElementById('genre').value,
                description: document.getElementById('description').value.trim(),
                coverImage: coverImage,
                tracks: [],
                dateAdded: new Date().toISOString()
            };

            vinylCollection.push(newVinyl);
            await saveStorage();

            document.getElementById('addVinylForm').reset();
            renderGallery();
            updateStats();
            alert('✅ Пластинка добавлена!');
        });

        // Delete vinyl
        function deleteVinyl(id) {
            if (!isAdmin) {
                alert('Только администратор может удалять');
                return;
            }

            if (confirm('Удалить?')) {
                vinylCollection = vinylCollection.filter(v => v.id !== id);
                saveStorage();
                renderGallery();
                updateStats();
                closeDetailModal();
            }
        }

        // Add track
        function addTrack(vinylId) {
            if (!isAdmin) {
                alert('Только администратор может добавлять треки');
                return;
            }

            const trackName = document.getElementById(`trackName-${vinylId}`).value.trim();
            const trackDuration = document.getElementById(`trackDuration-${vinylId}`).value.trim();

            if (!trackName) {
                alert('Введите название трека');
                return;
            }

            const vinyl = vinylCollection.find(v => v.id === vinylId);
            if (!vinyl) return;

            if (!vinyl.tracks) vinyl.tracks = [];

            vinyl.tracks.push({
                id: Date.now(),
                name: trackName,
                duration: trackDuration
            });

            saveStorage();
            showDetailModal(vinylId);
        }

        // Delete track
        function deleteTrack(vinylId, trackId) {
            if (!isAdmin) {
                alert('Только администратор может удалять');
                return;
            }

            const vinyl = vinylCollection.find(v => v.id === vinylId);
            if (!vinyl) return;

            vinyl.tracks = vinyl.tracks.filter(t => t.id !== trackId);
            saveStorage();
            showDetailModal(vinylId);
        }

        // Update stats
        function updateStats() {
            document.getElementById('totalCount').textContent = vinylCollection.length;
            
            const genres = new Set(vinylCollection.map(v => v.genre));
            document.getElementById('genreCount').textContent = genres.size;

            const artists = new Set(vinylCollection.map(v => v.artist));
            document.getElementById('artistCount').textContent = artists.size;
        }

        // Render gallery
        function renderGallery() {
            const gallery = document.getElementById('gallery');
            const emptyState = document.getElementById('emptyState');

            if (vinylCollection.length === 0) {
                gallery.innerHTML = '';
                emptyState.style.display = 'block';
            } else {
                emptyState.style.display = 'none';
                gallery.innerHTML = vinylCollection.map(vinyl => {
                    const trackCount = vinyl.tracks ? vinyl.tracks.length : 0;
                    return `
                    <div class="vinyl-card" onclick="showDetailModal(${vinyl.id})">
                        <div class="album-cover">
                            ${vinyl.coverImage ? `<img src="${vinyl.coverImage}" alt="${vinyl.album}">` : '💿'}
                        </div>
                        <div class="card-info">
                            <h3>${vinyl.album}</h3>
                            <p style="color: #d4af37;">${vinyl.artist}</p>
                            <div class="genre-tag">${vinyl.genre}</div>
                            ${vinyl.year ? `<p style="font-size: 0.9em; color: #999;">📅 ${vinyl.year}</p>` : ''}
                            <p style="font-size: 0.9em; color: #888;">🎵 ${trackCount} треков</p>
                        </div>
                    </div>
                `;
                }).join('');
            }
        }

        // Show detail modal
        function showDetailModal(id) {
            const vinyl = vinylCollection.find(v => v.id === id);
            if (!vinyl) return;

            const modal = document.getElementById('detailModal');
            const body = document.getElementById('modalBody');

            const coverHtml = vinyl.coverImage 
                ? `<img src="${vinyl.coverImage}" style="width: 100%; max-width: 300px; border-radius: 8px; margin-bottom: 20px;">`
                : `<div style="width: 100%; max-width: 300px; height: 300px; background: linear-gradient(135deg, #555, #333); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #888; font-size: 3em; margin-bottom: 20px;">💿</div>`;

            const tracksHtml = vinyl.tracks && vinyl.tracks.length > 0
                ? vinyl.tracks.map((track, index) => `
                    <div class="track-item">
                        <div class="track-number">${index + 1}</div>
                        <div class="track-info">
                            <div class="track-name">${track.name}</div>
                            ${track.duration ? `<div class="track-duration">⏱️ ${track.duration}</div>` : ''}
                        </div>
                        <button class="track-delete-btn ${!isAdmin ? 'hidden' : ''}" onclick="deleteTrack(${vinyl.id}, ${track.id})">Удалить</button>
                    </div>
                `).join('')
                : '<p style="color: #888;">Треков еще нет</p>';

            body.innerHTML = `
                ${coverHtml}
                <h2 style="color: #d4af37; margin-bottom: 10px;">${vinyl.album}</h2>
                <p><strong>Исполнитель:</strong> ${vinyl.artist}</p>
                <p><strong>Жанр:</strong> <span class="genre-tag">${vinyl.genre}</span></p>
                ${vinyl.year ? `<p><strong>Год выпуска:</strong> ${vinyl.year}</p>` : ''}
                ${vinyl.description ? `<p style="margin-top: 20px; padding-top: 20px; border-top: 1px solid #d4af37;"><strong>Заметки:</strong><br>${vinyl.description}</p>` : ''}

                <div class="tracklist-section">
                    <h3>🎵 Треклист</h3>
                    
                    <div class="add-track-form ${!isAdmin ? 'hidden' : ''}">
                        <input type="text" id="trackName-${vinyl.id}" placeholder="Название трека" style="width: 100%;">
                        <input type="text" id="trackDuration-${vinyl.id}" placeholder="Длительность (3:45)" style="width: 100%;">
                        <button class="btn-primary" onclick="addTrack(${vinyl.id})" style="width: 100%; margin-top: 10px;">➕ Добавить трек</button>
                    </div>

                    <div>${tracksHtml}</div>
                </div>

                ${isAdmin ? `<button class="btn-danger" onclick="deleteVinyl(${vinyl.id}); closeDetailModal();" style="width: 100%; margin-top: 20px;">🗑️ Удалить пластинку</button>` : ''}
            `;

            modal.classList.add('active');
        }

        // Close modal
        function closeDetailModal() {
            document.getElementById('detailModal').classList.remove('active');
        }

        // Close modal on outside click
        document.getElementById('detailModal').addEventListener('click', (e) => {
            if (e.target.id === 'detailModal') closeDetailModal();
        });

        // Init
        console.log('✅ Приложение готово');
    </script>
</body>
</html>
